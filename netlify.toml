[build]
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Nice URLs (no trailing index.html leakage) — Eleventy already outputs
# folder/index.html per page, Netlify serves these as clean directory URLs by default.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
